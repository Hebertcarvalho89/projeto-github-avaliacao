
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo 2 - Position e Z-index</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .container {
      position: relative;
      height: 350px;
      background-color: #eeeeee;
      border: 2px dashed #999999;
    }

    .foto {
      position: absolute;
      width: 250px;
      height: 170px;
      object-fit: cover;
      border: 5px solid white;
    }

    .foto1 {
      top: 30px;
      left: 30px;
      z-index: 1;
    }

    .foto2 {
      top: 100px;
      left: 150px;
      z-index: 2;
    }
  </style>
</head>

<body>

  <h1>Fotografias sobrepostas</h1>

  <div class="container">
    <img class="foto foto1"
         src="https://picsum.photos/id/1015/500/300"
         alt="Montanhas">

    <img class="foto foto2"
         src="https://picsum.photos/id/1025/500/300"
         alt="Cão">
  </div>

</body>
</html>
